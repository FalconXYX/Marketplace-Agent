name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Test (live tests skip without MA_LIVE_TESTS=1)
        run: uv run pytest

      - name: Simulate a sale (offline model stand-in, fails on any rule violation)
        run: uv run agent simulate --scenario desk --days 7
